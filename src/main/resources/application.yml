spring:
  application:
    name: stamp-tour-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stamptour}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

server:
  port: ${SERVER_PORT:8080}

grpc:
  server:
    port: ${GRPC_PORT:9090}