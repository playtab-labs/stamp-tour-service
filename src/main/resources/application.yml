spring:
  application:
    name: stamp-tour-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pentaport}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

grpc:
  server:
    port: ${GRPC_PORT:9090}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs